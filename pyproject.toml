[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a-share-claw"
version = "0.1.0"
description = "Minimal personal A-share investment research agent over Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
a-share-claw = "a_share_claw.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/a_share_claw"]
