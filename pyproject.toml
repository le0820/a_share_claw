[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a-share-claw"
version = "0.1.0"
description = "Portable investment research harness with controlled data plugins."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.5.0",
  "httpx>=0.28,<1",
  "numpy>=2.0",
  "pandas>=2.0",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
market = [
  "easy-tdx @ https://files.pythonhosted.org/packages/06/4e/445c233278e59528366868bf0b91ea0bdda5b397770b76ca49bba9cf3b14/easy_tdx-1.20.4-py3-none-any.whl#sha256=b45794c11f871607f4661cf17d926f1c5e1896ede84742b42ae874422b74fdef",
]
dev = [
  "pytest>=8.0",
  "requests>=2.32",
]

[project.scripts]
a-share-claw = "a_share_claw.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/a_share_claw"]

[tool.hatch.metadata]
allow-direct-references = true
